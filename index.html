<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO_SHELL_V1</title>
    <style>
        :root {
            /* NEOBRUTALIST PALETTE */
            --bg-color: #f0f0f0;         /* Light grey background */
            --card-bg: #ffffff;          /* White content areas */
            --accent: #FF5C00;           /* International Orange */
            --border: 4px solid #000000; /* THICK BOLD BORDERS */
            --shadow: 8px 8px 0px 0px #000000; /* Hard, offset shadow */
            --font-main: 'Courier New', Courier, monospace; /* Raw code aesthetic */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden; /* Prevent body scroll, handle inside containers */
        }

        /* HEADER AREA */
        header {
            background: var(--card-bg);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            letter-spacing: -1px;
            background: #000;
            color: #fff;
            padding: 5px 10px;
        }

        /* ROTATING MARQUEE CONTAINER */
        .marquee-container {
            border: var(--border);
            background: var(--accent);
            color: white;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            box-shadow: var(--shadow);
            height: 60px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .marquee-track {
            display: inline-block;
            animation: scroll 20s linear infinite;
            padding-left: 100%; /* Start from right */
        }

        /* The scrolling links */
        .marquee-link {
            display: inline-block;
            font-size: 1.5rem;
            font-weight: bold;
            color: black;
            text-decoration: none;
            margin-right: 50px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 4px solid transparent;
        }

        .marquee-link:hover {
            background-color: black;
            color: var(--accent);
            border-bottom: 4px solid black;
        }

        /* MAIN EMBED VIEWPORT */
        .viewport {
            flex-grow: 1;
            border: var(--border);
            box-shadow: var(--shadow);
            background: white;
            position: relative;
        }

        /* The label tab on top of the iframe */
        .viewport-label {
            position: absolute;
            top: 0;
            left: 0;
            background: black;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            border-bottom: 4px solid black;
            border-right: 4px solid black;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ANIMATION KEYFRAMES */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.2rem; }
            .marquee-link { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>INDEX_OF_WORKS</h1>
        <div style="font-weight:bold;">[ STATUS: ONLINE ]</div>
    </header>

    <div class="marquee-container">
        <div class="marquee-track" id="marquee-track">
            <a class="marquee-link" onclick="loadPage('embeds/liquidrainbow-text-shader.html', 'PROJECT ALPHA')">/// LIQUID TEXT</a>
            <a class="marquee-link" onclick="loadPage('embeds/rainbowshader.html', 'GALLERY VIEW')">/// rainbow_shader</a>
            <a class="marquee-link" onclick="loadPage('embeds/nebula-heatmap.html', 'nebula_heatmap')">/// nebula_heatmap</a>
            <a class="marquee-link" onclick="loadPage('embeds/inky_spot.html', 'inky_spot')">/// inky_spot</a>
            <a class="marquee-link" onclick="loadPage('embeds/clicky_orbs.html', 'clicky_orbs')">/// clicky_orbs</a>
            <a class="marquee-link" onclick="loadPage('embeds/that-one-i-made-in-2023-but-its-been-absorbed-into-the-ai-mind.html', 'that-one-i-made-in-2023-but-its-been-absorbed-into-the-ai-mind-defaults')">/// that-one-i-made-in-2023-but-its-been-absorbed-into-the-ai-mind-defaults</a>
            <a class="marquee-link" onclick="loadPage('embeds/mudslide-mercury.html', 'mudslide mercury')">/// mudslide_mercury</a>
            <a class="marquee-link" onclick="loadPage('embeds/swirling_temp.html', 'swirling_temp')">/// swirling_temp</a>
            <a class="marquee-link" onclick="loadPage('embeds/buck-creek-page.html', 'buckcreek')">/// buckcreek</a>
            <a class="marquee-link" onclick="loadPage('https://google.com', 'EXTERNAL_LINK')">/// EXTERNAL_REF</a>
            </div>
    </div>

    <main class="viewport">
        <div class="viewport-label" id="view-label">WAITING_FOR_INPUT...</div>
        <iframe id="main-frame" src="about:blank"></iframe>
    </main>

    <script>
        // Simple function to switch the iframe source
        function loadPage(url, label) {
            const frame = document.getElementById('main-frame');
            const labelDiv = document.getElementById('view-label');
            
            // Update Iframe
            frame.src = url;
            
            // Update Label
            labelDiv.textContent = "VIEWING: " + label;
        }

        // Optional: Pause marquee on hover
        const track = document.getElementById('marquee-track');
        track.addEventListener('mouseenter', () => {
            track.style.animationPlayState = 'paused';
        });
        track.addEventListener('mouseleave', () => {
            track.style.animationPlayState = 'running';
        });
    </script>
</body>
</html>
